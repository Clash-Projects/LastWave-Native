systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m -Dfile.encoding\=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.vfs.watch=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
ksp.incremental=true
# Preserve the existing Kotlin plugin and Android DSL with Backdrop's required AGP 9.
android.builtInKotlin=false
android.newDsl=false

# Release Keystore Signing Configuration (Default alias; passwords should be set via env / GitHub Secrets)
RELEASE_STORE_FILE=release.keystore
RELEASE_KEY_ALIAS=release_key
