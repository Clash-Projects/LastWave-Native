name: F-Droid Repo Update

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to pull the APK from (e.g., 4.1.0). Empty = latest release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fdroid:
    name: Rebuild F-Droid repo index & deploy to Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (config, metadata, tools)
        uses: actions/checkout@v4

      - name: Checkout pages branch (repo content)
        uses: actions/checkout@v4
        with:
          ref: pages
          path: pages

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver python3-pip
          # Ubuntu's packaged androguard fails on AGP 8+ resources.arsc
          # ("ResParserError: res1 must be zero!"). 3.4.0a1 is the version
          # shipped by Debian trixie and is verified working with these APKs.
          sudo python3 -m pip install --break-system-packages "androguard==3.4.0a1"
          python3 -c "import androguard; print('androguard', androguard.__version__)"

      - name: Restore repo signing keystore
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p fdroid
          echo "$FDROID_KEYSTORE_BASE64" | base64 -d > fdroid/keystore.p12

      - name: Generate config.yml from template with secrets
        env:
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASS }}
        run: |
          sed -e "s/CHANGE_ME_FDROID_KEYSTORE_PASS/$FDROID_KEYSTORE_PASS/" \
              -e "s/CHANGE_ME_FDROID_KEY_PASS/$FDROID_KEY_PASS/" \
              -e "s|keystore: fdroid/keystore.p12|keystore: $(pwd)/fdroid/keystore.p12|" \
              fdroid/config.yml.example > fdroid/config.yml
          chmod 600 fdroid/config.yml

      - name: Copy LastWave logo (repo icon)
        run: cp lastwave_logo.png fdroid/

      - name: Determine target release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPSTREAM_REPO: Clash-Projects/LastWave-Native
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG=$(python3 fdroid/tools/resolve_apk.py --print-tag --upstream "$UPSTREAM_REPO")
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download release APK (universal)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPSTREAM_REPO: Clash-Projects/LastWave-Native
        run: |
          set -euo pipefail
          mkdir -p fdroid/repo
          TAG="${{ steps.rel.outputs.tag }}"
          URL=$(python3 fdroid/tools/resolve_apk.py --tag "$TAG" --upstream "$UPSTREAM_REPO")
          echo "Downloading $URL"
          curl -sL -H "Authorization: token $GH_TOKEN" -o "fdroid/repo/LastWave-v${TAG}-universal.apk" "$URL"

      - name: Rebuild repo index
        env:
          ANDROID_HOME: /usr/lib/android-sdk
        working-directory: fdroid
        run: fdroid update

      - name: Verify index signature
        working-directory: fdroid
        run: |
          jarsigner -verify repo/index-v1.jar
          keytool -printcert -jarfile repo/index-v1.jar | grep -E "Owner|SHA256"

      - name: Deploy to pages branch
        run: |
          mkdir -p pages/fdroid/repo
          cp -r fdroid/repo/* pages/fdroid/repo/
          cp fdroid/fingerprint.txt pages/fdroid/ 2>/dev/null || true
          cd pages
          git config user.name "Srishanth Goud"
          git config user.email "147091568+iamsrishanth@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" || git commit -m "fdroid: rebuild repo for release ${{ steps.rel.outputs.tag }}"
          git push origin pages

      - name: Cleanup secrets
        if: always()
        run: rm -f fdroid/config.yml fdroid/keystore.p12
