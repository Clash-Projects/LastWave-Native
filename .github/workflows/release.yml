name: Publish Selected Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git Tag (e.g., 4.2.3)'
        required: true
        default: '4.2.3'
      release_name:
        description: 'Release Title (e.g., LastWave 4.2.3)'
        required: true
        default: 'Update v4.2.3'
      release_notes:
        description: 'Changelog / Release Notes'
        required: false
        default: ''

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
      RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
      LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
      LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}
      EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build Android 10 Release APKs (compressed + raw)
        env:
          ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
          LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
          LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease assembleRawRelease --stacktrace

        # NOTE: Gradle signs release + rawRelease in place via the
        # release_config signingConfig (v1+v2+v3), so no separate re-sign
        # step is needed. A missing keystore now fails the build outright
        # instead of silently shipping a debug-signed APK.

      - name: Stage Android 10 Final APKs
        run: |
          mkdir -p final_apk
          TAG="${{ inputs.tag_name }}"
          # Universal release (Android 10+, R8 + ProGuard + shrinkResources)
          if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
            cp app/build/outputs/apk/release/app-release-signed.apk final_apk/LastWave-v${TAG}-universal.apk
          else
            cp app/build/outputs/apk/release/app-release.apk final_apk/LastWave-v${TAG}-universal.apk
          fi
          # Universal uncompressed variant (Android 10+, raw debuggable/unminified)
          if [ -f "app/build/outputs/apk/rawRelease/app-rawRelease-signed.apk" ]; then
            cp app/build/outputs/apk/rawRelease/app-rawRelease-signed.apk final_apk/LastWave-v${TAG}-universal-uncompressed.apk
          else
            cp app/build/outputs/apk/rawRelease/app-rawRelease.apk final_apk/LastWave-v${TAG}-universal-uncompressed.apk
          fi
          rm -rf app/build/outputs/apk/release/*

      - name: Build Android 7.0 Legacy APK (compressed)
        env:
          ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
          LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
          LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PminSdk=24 --stacktrace

      - name: Sign Android 7 Legacy APK with Custom Key (Optional)
        if: env.SIGNING_KEY != ''
        uses: r0adkll/sign-android-release@v1
        id: sign_app_legacy
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Stage Android 7 Final APK
        run: |
          TAG="${{ inputs.tag_name }}"
          if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
            cp app/build/outputs/apk/release/app-release-signed.apk final_apk/LastWave-v${TAG}-android7.apk
          else
            cp app/build/outputs/apk/release/app-release.apk final_apk/LastWave-v${TAG}-android7.apk
          fi
          ls -lh final_apk/

      - name: Verify APK signatures + publish checksums
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          # Never publish a package the installer will reject as invalid, and
          # never ship an APK signed by the wrong key. apksigner verify only
          # proves *a* signature is valid, not whose it is — so we also pin the
          # signer certificate digest.
          # EXPECTED_CERT_SHA256 defaults to the current release key prefix;
          # override with the full digest via a repo secret when the key rotates.
          SDKROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDKROOT/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | head -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $SDKROOT — refusing to publish unverified APKs"
            exit 1
          fi
          EXPECTED_CERT_SHA256="${EXPECTED_CERT_SHA256:-ed79fe6f}"
          for apk in final_apk/*.apk; do
            echo "Verifying $apk ..."
            "$APKSIGNER" verify --print-certs "$apk" > /dev/null || { echo "::error::APK failed signature verification: $apk"; exit 1; }
            CERT_SHA=$("$APKSIGNER" verify --print-certs "$apk" 2>/dev/null | grep -i 'SHA-256 digest' | head -n1 | awk '{print $NF}' | tr 'A-F' 'a-f')
            if [ -z "$CERT_SHA" ]; then
              echo "::error::Could not read signing certificate digest for $apk"; exit 1
            fi
            case "$CERT_SHA" in
              ${EXPECTED_CERT_SHA256}*) echo "Signer cert OK: $CERT_SHA" ;;
              *) echo "::error::$apk signed by unexpected certificate ($CERT_SHA); expected prefix ${EXPECTED_CERT_SHA256}"; exit 1 ;;
            esac
          done
          echo "All APK signatures valid and match the pinned certificate."
          (cd final_apk && sha256sum *.apk > SHA256SUMS.txt)
          cat final_apk/SHA256SUMS.txt

      - name: Prepare Release Notes & Compatibility Notice
        env:
          TAG: ${{ inputs.tag_name }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          cat << 'EOF' | sed 's/^ *//' > notice.md
          ### 📦 Download Packages & Compatibility

          | Package | Recommended OS | Description |
          | :--- | :--- | :--- |
          | **`LastWave-v__TAG__-universal.apk`** (~22 MB) | **Android 10+ (Android 10 – 16+)** | **Standard Recommended Release.** R8-optimized with uncompressed page-aligned native libraries for instant memory mapping. |
          | **`LastWave-v__TAG__-universal-uncompressed.apk`** (~89 MB) | **Android 10+ (Android 10 – 16+)** | **Raw Release.** Unminified debuggable variant with uncompressed native libraries. |
          | **`LastWave-v__TAG__-android7.apk`** (~17 MB) | **Android 7.0 – 9.0 (Legacy)** | **Legacy Android 7.0+ Variant.** Built with compressed native libraries for older package managers. |

          > [!WARNING]
          > **Notice for Android 7.0 – 9.0 Users (`LastWave-v__TAG__-android7.apk`):**
          > - Hardware GPU glassmorphism / live blur requires Android 12+ and is automatically replaced with translucent dark canvas acrylic styling on older devices.
          > - The media notification uses classic Android media controls rather than Android 13's wavy-progress player.
          > - For any device running Android 10 or newer, please install the standard **`LastWave-v__TAG__-universal.apk`** for optimal performance and memory efficiency.
          EOF

          sed -i "s/__TAG__/${TAG}/g" notice.md

          if echo "$NOTES" | grep -q "android7"; then
            printf "%s\n" "$NOTES" > release_body.md
          elif [ -n "$NOTES" ]; then
            printf "%s\n\n---\n\n" "$NOTES" > release_body.md
            cat notice.md >> release_body.md
          else
            cat notice.md > release_body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          body_path: release_body.md
          files: |
            final_apk/*.apk
            final_apk/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
