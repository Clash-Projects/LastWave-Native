name: Build LastWave Beta APK

on:
  push:
    branches: [ beta ]
  pull_request:
    branches: [ beta ]
  workflow_dispatch:

jobs:
  build-beta:
    name: Build & Package Beta APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
      RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
      LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
      LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build Beta Release APKs
        env:
          ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
          LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
          LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease assembleRawRelease --stacktrace

        # NOTE: Gradle signs release + rawRelease in place via the
        # release_config signingConfig (v1+v2+v3), so no separate re-sign
        # step is needed. A missing keystore now fails the build outright
        # instead of silently shipping a debug-signed APK.

      - name: Prepare Beta APKs
        id: prep_apk
        run: |
          mkdir -p final_apk
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="4.2.3"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building Beta APKs for LastWave v${VERSION}-beta"
          # Compressed release (R8 + ProGuard + shrinkResources)
          if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
            cp app/build/outputs/apk/release/app-release-signed.apk final_apk/LastWave-v${VERSION}-beta.apk
          else
            cp app/build/outputs/apk/release/app-release.apk final_apk/LastWave-v${VERSION}-beta.apk
          fi
          # Raw release (uncompressed / unminified)
          if [ -f "app/build/outputs/apk/rawRelease/app-rawRelease-signed.apk" ]; then
            cp app/build/outputs/apk/rawRelease/app-rawRelease-signed.apk final_apk/LastWave-v${VERSION}-beta-raw.apk
          else
            cp app/build/outputs/apk/rawRelease/app-rawRelease.apk final_apk/LastWave-v${VERSION}-beta-raw.apk
          fi
          ls -lh final_apk/

      - name: Upload Beta APK Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LastWave-v${{ steps.prep_apk.outputs.version }}-Beta-APKs
          path: final_apk/*.apk
          if-no-files-found: error
